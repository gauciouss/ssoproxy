  sso-poc-target-web1:
    image: nginx:alpine
    container_name: sso-poc-target-web1
    restart: always
    ports:
      - "9090:80"
    volumes:
      - ./target-web1:/usr/share/nginx/html:ro
    networks:
      - sso-poc-secure-net

  sso-poc-target-web2:
    image: nginx:alpine
    container_name: sso-poc-target-web2
    restart: always
    ports:
      - "9091:80"
    volumes:
      - ./target-web2:/usr/share/nginx/html:ro
    networks:
      - sso-poc-secure-net

