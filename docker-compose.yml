networks:
  sso-poc-secure-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.254.0/24

services:
  sso-poc-nginx:
    image: nginx:alpine
    container_name: sso-poc-nginx-lb
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./f5-config/f5-ltm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      sso-poc-proxy1:
        condition: service_healthy
      sso-poc-proxy2:
        condition: service_healthy
    networks:
      sso-poc-secure-net:
        ipv4_address: 172.31.254.10

  sso-poc-proxy1:
    build:
      context: .
      dockerfile: ./ssoproxy/dockerfile
    container_name: sso-poc-proxy-1
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      SSOPROXY_CONTAINER_NAME: sso-poc-proxy-1
      SsoCookieDomain: .gd.com
      SsoWhitelist: '["^/target-web/health$"]'
      ConnectionStrings__MSSQL: >-
        Server=${SQLSERVER_ADDR};Database=sso;User Id=${MSSQL_APP_USER};Password=${MSSQL_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;
      ConnectionStrings__Redis: >-
        sso-poc-sentinel1:26379,sso-poc-sentinel2:26379,password=${REDIS_PASSWORD},serviceName=mymaster,abortConnect=false
    volumes:
      - ./ssoproxy/logs:/app/logs
      - ./ssoproxy/appSettings.json:/app/appsettings.json
      - ./ssoproxy/nlog.config:/app/nlog.config
      - ./ssoproxy/Views:/app/Views
      - ./ssoproxy/keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      sso-poc-sentinel1:
        condition: service_started
      sso-poc-sentinel2:
        condition: service_started
      # sso-poc-mssql-init:
      #   condition: service_completed_successfully
    networks:
      sso-poc-secure-net:
        ipv4_address: 172.31.254.11
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sso-poc-proxy2:
    build:
      context: .
      dockerfile: ./ssoproxy/dockerfile
    container_name: sso-poc-proxy-2
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      SSOPROXY_CONTAINER_NAME: sso-poc-proxy-2
      SsoCookieDomain: .gd.com
      SsoWhitelist: '["^/target-web/health$"]'
      ConnectionStrings__MSSQL: >-
        Server=${SQLSERVER_ADDR};Database=sso;User Id=${MSSQL_APP_USER};Password=${MSSQL_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;
      ConnectionStrings__Redis: >-
        sso-poc-sentinel1:26379,sso-poc-sentinel2:26379,password=${REDIS_PASSWORD},serviceName=mymaster,abortConnect=false
    volumes:
      - ./ssoproxy/logs:/app/logs
      - ./ssoproxy/appSettings.json:/app/appsettings.json
      - ./ssoproxy/nlog.config:/app/nlog.config
      - ./ssoproxy/Views:/app/Views
      - ./ssoproxy/keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      sso-poc-sentinel1:
        condition: service_started
      sso-poc-sentinel2:
        condition: service_started
      # sso-poc-mssql-init:
      #   condition: service_completed_successfully
    networks:
      sso-poc-secure-net:
        ipv4_address: 172.31.254.12
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sso-poc-mgr:
    build:
      context: .
      dockerfile: ./ssoproxymgr/dockerfile
    container_name: sso-poc-mgr
    restart: always
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ManagerAuth__Username: ${MGR_USERNAME}
      ManagerAuth__Password: ${MGR_PASSWORD}
      SsoproxyApiBaseUrl: http://sso-poc-proxy-1:80
      ConnectionStrings__MSSQL: >-
        Server=${SQLSERVER_ADDR};Database=sso;User Id=${MSSQL_APP_USER};Password=${MSSQL_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;
    volumes:
      - ./ssoproxymgr/appsettings.json:/app/appsettings.json:ro
    depends_on:
      sso-poc-proxy1:
        condition: service_started
      sso-poc-proxy2:
        condition: service_started
      # sso-poc-mssql-init:
      #   condition: service_completed_successfully
    networks:
      - sso-poc-secure-net

  sso-poc-redis-master:
    image: redis:7.2-alpine
    container_name: sso-poc-redis-master
    restart: always
    command: >-
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    networks:
      - sso-poc-secure-net

  sso-poc-redis-slave:
    image: redis:7.2-alpine
    container_name: sso-poc-redis-slave
    restart: always
    command: >-
      redis-server --replicaof sso-poc-redis-master 6379 --appendonly yes --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    depends_on:
      - sso-poc-redis-master
    networks:
      - sso-poc-secure-net

  sso-poc-sentinel1:
    image: redis:7.2-alpine
    container_name: sso-poc-sentinel-1
    restart: always
    command: >-
      sh -c "cp /usr/local/etc/redis/sentinel.conf /data/sentinel.conf &&
      redis-server /data/sentinel.conf --sentinel"
    volumes:
      - ./redis-config:/usr/local/etc/redis
    depends_on:
      - sso-poc-redis-master
    links:
      - sso-poc-redis-master:redis-master
    networks:
      - sso-poc-secure-net

  sso-poc-sentinel2:
    image: redis:7.2-alpine
    container_name: sso-poc-sentinel-2
    restart: always
    command: >-
      sh -c "cp /usr/local/etc/redis/sentinel.conf /data/sentinel.conf &&
      redis-server /data/sentinel.conf --sentinel"
    volumes:
      - ./redis-config:/usr/local/etc/redis
    depends_on:
      - sso-poc-redis-slave
    links:
      - sso-poc-redis-master:redis-master
    networks:
      - sso-poc-secure-net

