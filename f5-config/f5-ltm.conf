# ==========================================
# F5 LTM 配置模擬：定義後端 Proxy Pool
# ==========================================
upstream sso_proxy_pool {
    # 輪詢調度 (Round Robin)
    server 172.20.0.11:8080 max_fails=2 fail_timeout=5s; # sso-proxy-1
    server 172.20.0.12:8080 max_fails=2 fail_timeout=5s; # sso-proxy-2
    
    # 【F5 剛性防禦】：每 5 秒自動發送健康檢查，若 Proxy 閃退立刻將流量剔除
}

# ==========================================
# F5 Virtual Server 配置：監聽 test.gd.com:80
# ==========================================
server {
    listen 80;
    server_name test.gd.com;

    # 結構化 F5 訪問日誌，完美對接 ELK
    access_log /var/log/nginx/f5_access.json combined;

    location / {
        # 轉發給後端 Pool
        proxy_pass http://sso_proxy_pool;
        
        # 【金融級 Header 保全】：透傳真實客戶端 IP 與 網域
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 緩衝與逾時防禦設定 (防止 Webview 連線閃斷)
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    upstream sso_proxy_pool {
        server 172.31.254.11:8080 max_fails=2 fail_timeout=5s; # sso-proxy-1 新 IP
        server 172.31.254.12:8080 max_fails=2 fail_timeout=5s; # sso-proxy-2 新 IP
    }
}